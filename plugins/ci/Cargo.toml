[package]
name = "gate-plugin-ci"
description = "The ci plugin of Gate: GitHub Actions workflows held to one standard, the ci/recommended preset"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version = "0.3.0"

[lib]
# The component is `ci.wasm`; the rlib lets the native tests call the plugin.
name = "ci"
crate-type = ["cdylib", "rlib"]

[dependencies]
gate-sdk = { workspace = true, features = ["yaml"] }
globset.workspace = true
regex.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
