[package]
name = "gate-plugin-markdown"
description = "The markdown plugin of Gate: local links resolve, pages carry their front matter and their required sections"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version = "0.3.0"

[lib]
# The component is `markdown.wasm`; the rlib lets the native tests call the plugin.
name = "markdown"
crate-type = ["cdylib", "rlib"]

[dependencies]
gate-sdk.workspace = true
pulldown-cmark.workspace = true
regex.workspace = true

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
