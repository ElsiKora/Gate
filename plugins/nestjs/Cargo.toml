[package]
name = "gate-plugin-nestjs"
description = "The nestjs plugin of Gate: source conventions of NestJS services built on TypeORM and a CRUD automator"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version = "0.3.0"

[lib]
# The component is `nestjs.wasm`; the rlib serves the native tests.
name = "nestjs"
crate-type = ["cdylib", "rlib"]

[dependencies]
gate-sdk.workspace = true
gate-typescript.workspace = true
pulldown-cmark.workspace = true
regex-automata.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
# The speed tests count the parses of a call.
gate-typescript = { workspace = true, features = ["parse-log"] }

[lints]
workspace = true
