# Generated by gate sync from gate.toml [ci.github]; edit gate.toml, then run gate sync.
name: Gate
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: .github/workflows/gate.yml@${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      projects: ${{ steps.changes.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the generated files
        run: bin/gate sync --check
        env:
          GATE_BRANCH: ${{ github.head_ref || github.ref_name }}
          GATE_GITHUB_TOKEN: ${{ secrets.GATE_GITHUB_TOKEN || github.token }}
      - id: changes
        name: List the changed projects
        run: bin/gate check --list-changed-projects --format github-output --push "$GATE_RANGE" --target-ref "$GATE_TARGET_REF" >> "$GITHUB_OUTPUT"
        env:
          GATE_BRANCH: ${{ github.head_ref || github.ref_name }}
          GATE_GITHUB_TOKEN: ${{ secrets.GATE_GITHUB_TOKEN || github.token }}
          GATE_RANGE: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}..${{ github.sha }}
          GATE_TARGET_REF: ${{ github.base_ref && format('refs/heads/{0}', github.base_ref) || github.ref }}
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gate check --push
        run: bin/gate check --push "$GATE_RANGE" --target-ref "$GATE_TARGET_REF" --no-overrides
        env:
          GATE_BRANCH: ${{ github.head_ref || github.ref_name }}
          GATE_GITHUB_TOKEN: ${{ secrets.GATE_GITHUB_TOKEN || github.token }}
          GATE_RANGE: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}..${{ github.sha }}
          GATE_TARGET_REF: ${{ github.base_ref && format('refs/heads/{0}', github.base_ref) || github.ref }}
  gate-passed:
    runs-on: ubuntu-24.04
    needs:
      - changes
      - gate
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Require every job to succeed or be skipped
        run: failed=$(printf '%s' "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key) is \(.value.result)"'); if [ -n "$failed" ]; then printf 'jobs that neither succeeded nor were skipped:\n%s\n' "$failed"; exit 1; fi
        env:
          NEEDS: ${{ toJSON(needs) }}
