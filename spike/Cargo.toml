# The T-001 plugin-form spike: one workload built three ways; results in RESULTS.md.
[workspace]
members = ["guest", "host", "plugin", "workload"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
version = "0.0.0"

[workspace.dependencies]
oxc_allocator = "=0.153.0"
oxc_ast = "=0.153.0"
oxc_ast_visit = "=0.153.0"
oxc_parser = "=0.153.0"
oxc_resolver = { version = "=11.24.3", default-features = false }
oxc_semantic = "=0.153.0"
oxc_span = "=0.153.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
spike-workload = { path = "workload" }

# The same release profile as the repository root, for native and wasm alike.
[profile.release]
codegen-units = 16
debug = false
lto = false
opt-level = 3
strip = true
